<!DOCTYPE html>
<html>
<head>
    <title>STQA Practical Exam - Login</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 100px;
        }

        .login-box {
            width: 350px;
            margin: auto;
            padding: 30px;
            border: 1px solid #ccc;
            border-radius: 10px;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 10px;
        }

        button {
            padding: 10px 30px;
            cursor: pointer;
        }
    </style>

    <script>
        function login() {

            var username =
                document.getElementById("username").value;

            var password =
                document.getElementById("password").value;

            if (username === "student" && password === "1234") {

                window.location.href = "login-success.html";

            } else {

                document.getElementById("error")
                    .innerHTML = "Invalid username or password";
            }
        }
    </script>
</head>

<body>

<div class="login-box">

    <h2>Student Login</h2>

    <input type="text"
           id="username"
           placeholder="Enter Username">

    <input type="password"
           id="password"
           placeholder="Enter Password">

    <br>

    <button id="loginBtn"
            onclick="login()">
        Login
    </button>

    <p id="error"></p>

</div>

</body>
</html>
